name: CI

# Converted from the former builds.sr.ht manifest (.build.yml).
# Each sourcehut task is one step; $HOME is the workspace, as on sourcehut.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash -xe {0}
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y git ca-certificates \
            latexmk \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-german \
            texlive-bibtex-extra \
            texlive-science

      - uses: actions/checkout@v4
        with:
          path: "bachelorthesis"
          submodules: recursive
          fetch-depth: 0

      - name: "build-pdf"
        run: |
          export HOME="$GITHUB_WORKSPACE"
          cd "$HOME"
          cd "$HOME/bachelorthesis"
          latexmk -pdf -interaction=nonstopmode -file-line-error htwsaar-i-mst-vorlage.tex

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts
          if-no-files-found: warn
          path: |
            bachelorthesis/htwsaar-i-mst-vorlage.pdf
